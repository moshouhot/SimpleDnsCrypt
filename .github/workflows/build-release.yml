name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.8.0)'
        required: true
        default: '0.8.0'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore SimpleDnsCrypt.sln

    - name: Build Solution (Release x64)
      run: msbuild SimpleDnsCrypt.sln /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\Release\net48\
      
    - name: Create ZIP package
      shell: powershell
      run: |
        # 创建输出目录
        New-Item -ItemType Directory -Force -Path "dist"

        # 获取版本号
        if ($env:GITHUB_REF -match "refs/tags/v(.*)") {
          $version = $matches[1]
        } elseif ($env:VERSION) {
          $version = $env:VERSION
        } else {
          $version = "${{ github.event.inputs.version }}"
        }

        if (-not $version) {
          $version = "0.8.0"
        }

        echo "Building version: $version"

        # 创建x64绿色版ZIP
        $x64Path = "SimpleDnsCrypt\bin\Release\net48"
        if (Test-Path $x64Path) {
          Compress-Archive -Path "$x64Path\*" -DestinationPath "dist\SimpleDnsCrypt-$version-x64-portable.zip" -Force
          echo "Created x64 portable ZIP"
        } else {
          echo "Error: x64 build path not found: $x64Path"
          exit 1
        }

        # 设置环境变量供后续步骤使用
        echo "VERSION=$version" >> $env:GITHUB_ENV
      env:
        VERSION: ${{ github.event.inputs.version }}
        
    - name: Setup WiX Toolset
      shell: powershell
      run: |
        # 下载并安装WiX Toolset
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe" -OutFile "wix311.exe"
        Start-Process -FilePath "wix311.exe" -ArgumentList "/quiet" -Wait
        
        # 添加WiX到PATH
        $wixPath = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
        echo "$wixPath" >> $env:GITHUB_PATH
        
    - name: Create MSI installer
      shell: powershell
      run: |
        # 创建WiX配置文件
        $wxsContent = @"
<?xml version="1.0" encoding="UTF-8"?>
<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
  <Product Id="*"
           Name="SimpleDNSCrypt"
           Language="1033"
           Version="$env:VERSION.0"
           Manufacturer="bitbeans"
           UpgradeCode="A3B2C1D4-E5F6-7890-ABCD-EF1234567890">

    <Package InstallerVersion="200"
             Compressed="yes"
             InstallScope="perMachine"
             Description="SimpleDNSCrypt - A simple management tool for dnscrypt-proxy" />

    <MajorUpgrade DowngradeErrorMessage="A newer version of SimpleDNSCrypt is already installed." />
    <MediaTemplate EmbedCab="yes" />

    <Feature Id="ProductFeature" Title="SimpleDNSCrypt" Level="1">
      <ComponentGroupRef Id="ProductComponents" />
      <ComponentRef Id="ApplicationShortcut" />
      <ComponentRef Id="DesktopShortcut" />
    </Feature>

    <Directory Id="TARGETDIR" Name="SourceDir">
      <Directory Id="ProgramFilesFolder">
        <Directory Id="ManufacturerFolder" Name="bitbeans">
          <Directory Id="INSTALLFOLDER" Name="Simple DNSCrypt x64" />
        </Directory>
      </Directory>
      <Directory Id="ProgramMenuFolder">
        <Directory Id="ApplicationProgramsFolder" Name="SimpleDNSCrypt"/>
      </Directory>
      <Directory Id="DesktopFolder" Name="Desktop"/>
    </Directory>

    <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
      <Component Id="MainExecutable" Guid="*">
        <File Id="SimpleDnsCryptExe"
              Source="SimpleDnsCrypt\bin\Release\net48\SimpleDnsCrypt.exe"
              KeyPath="yes" />
        <File Id="SimpleDnsCryptConfig"
              Source="SimpleDnsCrypt\bin\Release\net48\SimpleDnsCrypt.exe.config" />
      </Component>

      <Component Id="DnsCryptProxyFolder" Guid="*">
        <CreateFolder />
        <File Id="DnsCryptProxyExe"
              Source="SimpleDnsCrypt\bin\Release\net48\dnscrypt-proxy\dnscrypt-proxy.exe" />
        <File Id="DnsCryptProxyToml"
              Source="SimpleDnsCrypt\bin\Release\net48\dnscrypt-proxy\dnscrypt-proxy.toml" />
        <File Id="DnsCryptProxyLicense"
              Source="SimpleDnsCrypt\bin\Release\net48\dnscrypt-proxy\LICENSE" />
      </Component>

      <Component Id="LocalizationEN" Guid="*">
        <CreateFolder />
        <File Id="LocalizationENDll"
              Source="SimpleDnsCrypt\bin\Release\net48\en\SimpleDnsCrypt.resources.dll" />
      </Component>

      <Component Id="LocalizationZH" Guid="*">
        <CreateFolder />
        <File Id="LocalizationZHDll"
              Source="SimpleDnsCrypt\bin\Release\net48\zh-hans\SimpleDnsCrypt.resources.dll" />
      </Component>
    </ComponentGroup>

    <DirectoryRef Id="ApplicationProgramsFolder">
      <Component Id="ApplicationShortcut" Guid="*">
        <Shortcut Id="ApplicationStartMenuShortcut"
                  Name="SimpleDNSCrypt"
                  Description="SimpleDNSCrypt - A simple management tool for dnscrypt-proxy"
                  Target="[#SimpleDnsCryptExe]"
                  WorkingDirectory="INSTALLFOLDER"/>
        <RemoveFolder Id="ApplicationProgramsFolder" On="uninstall"/>
        <RegistryValue Root="HKCU"
                       Key="Software\bitbeans\SimpleDNSCrypt"
                       Name="installed"
                       Type="integer"
                       Value="1"
                       KeyPath="yes"/>
      </Component>
    </DirectoryRef>

    <DirectoryRef Id="DesktopFolder">
      <Component Id="DesktopShortcut" Guid="*">
        <Shortcut Id="ApplicationDesktopShortcut"
                  Name="SimpleDNSCrypt"
                  Description="SimpleDNSCrypt - A simple management tool for dnscrypt-proxy"
                  Target="[#SimpleDnsCryptExe]"
                  WorkingDirectory="INSTALLFOLDER"/>
        <RegistryValue Root="HKCU"
                       Key="Software\bitbeans\SimpleDNSCrypt"
                       Name="desktop_shortcut"
                       Type="integer"
                       Value="1"
                       KeyPath="yes"/>
      </Component>
    </DirectoryRef>
  </Product>
</Wix>
"@

        $wxsContent | Out-File -FilePath "SimpleDnsCrypt.wxs" -Encoding UTF8

        # 编译WiX
        & candle.exe SimpleDnsCrypt.wxs
        if ($LASTEXITCODE -ne 0) {
          echo "WiX candle compilation failed"
          exit 1
        }

        & light.exe -ext WixUIExtension SimpleDnsCrypt.wixobj -out "dist\SimpleDnsCrypt-$env:VERSION-x64-setup.msi"
        if ($LASTEXITCODE -ne 0) {
          echo "WiX light linking failed"
          exit 1
        }

        echo "Created MSI installer"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SimpleDnsCrypt-Release
        path: dist/
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
