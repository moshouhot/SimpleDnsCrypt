name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.8.0)'
        required: true
        default: '0.8.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore SimpleDnsCrypt.sln

    - name: Build Solution (Release x64)
      run: msbuild SimpleDnsCrypt.sln /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\Release\net48\
      
    - name: Create ZIP package
      shell: powershell
      run: |
        # 创建输出目录
        New-Item -ItemType Directory -Force -Path "dist"

        # 获取版本号
        if ($env:GITHUB_REF -match "refs/tags/v(.*)") {
          $version = $matches[1]
        } elseif ($env:VERSION) {
          $version = $env:VERSION
        } else {
          $version = "${{ github.event.inputs.version }}"
        }

        if (-not $version) {
          $version = "0.8.0"
        }

        echo "Building version: $version"

        # 创建x64绿色版ZIP
        $x64Path = "SimpleDnsCrypt\bin\Release\net48"
        if (Test-Path $x64Path) {
          Compress-Archive -Path "$x64Path\*" -DestinationPath "dist\SimpleDnsCrypt-$version-x64-portable.zip" -Force
          echo "Created x64 portable ZIP"
        } else {
          echo "Error: x64 build path not found: $x64Path"
          exit 1
        }

        # 设置环境变量供后续步骤使用
        echo "VERSION=$version" >> $env:GITHUB_ENV
      env:
        VERSION: ${{ github.event.inputs.version }}
        
    - name: Setup WiX Toolset
      shell: powershell
      run: |
        # 下载并安装WiX Toolset
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe" -OutFile "wix311.exe"
        Start-Process -FilePath "wix311.exe" -ArgumentList "/quiet" -Wait
        
        # 添加WiX到PATH
        $wixPath = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
        echo "$wixPath" >> $env:GITHUB_PATH
        
    - name: Create MSI installer
      shell: powershell
      run: |
        # Create WiX configuration file with proper version substitution
        $version = if ($env:VERSION) { $env:VERSION } else { "0.8.0" }
        
        # Build the WXS content using string concatenation to avoid YAML parsing issues
        $wxsHeader = '<?xml version="1.0" encoding="UTF-8"?>' + "`n"
        $wxsHeader += '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">' + "`n"
        $wxsHeader += '  <Product Id="*" Name="SimpleDNSCrypt" Language="1033" Version="' + $version + '.0" Manufacturer="bitbeans" UpgradeCode="A3B2C1D4-E5F6-7890-ABCD-EF1234567890">' + "`n"
        
        $wxsPackage = '    <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" Description="SimpleDNSCrypt - A simple management tool for dnscrypt-proxy" />' + "`n"
        $wxsPackage += '    <MajorUpgrade DowngradeErrorMessage="A newer version of SimpleDNSCrypt is already installed." />' + "`n"
        $wxsPackage += '    <MediaTemplate EmbedCab="yes" />' + "`n"
        
        $wxsFeature = '    <Feature Id="ProductFeature" Title="SimpleDNSCrypt" Level="1">' + "`n"
        $wxsFeature += '      <ComponentGroupRef Id="ProductComponents" />' + "`n"
        $wxsFeature += '      <ComponentRef Id="ApplicationShortcut" />' + "`n"
        $wxsFeature += '      <ComponentRef Id="DesktopShortcut" />' + "`n"
        $wxsFeature += '    </Feature>' + "`n"
        
        $wxsDirectories = '    <Directory Id="TARGETDIR" Name="SourceDir">' + "`n"
        $wxsDirectories += '      <Directory Id="ProgramFilesFolder">' + "`n"
        $wxsDirectories += '        <Directory Id="ManufacturerFolder" Name="bitbeans">' + "`n"
        $wxsDirectories += '          <Directory Id="INSTALLFOLDER" Name="Simple DNSCrypt x64" />' + "`n"
        $wxsDirectories += '        </Directory>' + "`n"
        $wxsDirectories += '      </Directory>' + "`n"
        $wxsDirectories += '      <Directory Id="ProgramMenuFolder">' + "`n"
        $wxsDirectories += '        <Directory Id="ApplicationProgramsFolder" Name="SimpleDNSCrypt"/>' + "`n"
        $wxsDirectories += '      </Directory>' + "`n"
        $wxsDirectories += '      <Directory Id="DesktopFolder" Name="Desktop"/>' + "`n"
        $wxsDirectories += '    </Directory>' + "`n"
        
        $wxsComponents = '    <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">' + "`n"
        $wxsComponents += '      <Component Id="MainExecutable" Guid="3B94D0F3-8B80-4D56-B8ED-57DFB062CD56">' + "`n"
        $wxsComponents += '        <File Id="SimpleDnsCryptExe" Source="SimpleDnsCrypt\bin\Release\net48\SimpleDnsCrypt.exe" KeyPath="yes" />' + "`n"
        $wxsComponents += '        <File Id="SimpleDnsCryptConfig" Source="SimpleDnsCrypt\bin\Release\net48\SimpleDnsCrypt.exe.config" />' + "`n"
        $wxsComponents += '      </Component>' + "`n"
        $wxsComponents += '      <Component Id="DnsCryptProxyFolder" Guid="50A18563-A236-49DD-9BDF-A6DF106AE172">' + "`n"
        $wxsComponents += '        <CreateFolder />' + "`n"
        $wxsComponents += '        <File Id="DnsCryptProxyExe" Source="SimpleDnsCrypt\bin\Release\net48\dnscrypt-proxy\dnscrypt-proxy.exe" />' + "`n"
        $wxsComponents += '        <File Id="DnsCryptProxyToml" Source="SimpleDnsCrypt\bin\Release\net48\dnscrypt-proxy\dnscrypt-proxy.toml" />' + "`n"
        $wxsComponents += '        <File Id="DnsCryptProxyLicense" Source="SimpleDnsCrypt\bin\Release\net48\dnscrypt-proxy\LICENSE" />' + "`n"
        $wxsComponents += '      </Component>' + "`n"
        $wxsComponents += '    </ComponentGroup>' + "`n"
        
        $wxsShortcuts = '    <DirectoryRef Id="ApplicationProgramsFolder">' + "`n"
        $wxsShortcuts += '      <Component Id="ApplicationShortcut" Guid="AA4C9489-8562-4442-9CF1-A72D93D4845C">' + "`n"
        $wxsShortcuts += '        <Shortcut Id="ApplicationStartMenuShortcut" Name="SimpleDNSCrypt" Description="SimpleDNSCrypt - A simple management tool for dnscrypt-proxy" Target="[#SimpleDnsCryptExe]" WorkingDirectory="INSTALLFOLDER"/>' + "`n"
        $wxsShortcuts += '        <RemoveFolder Id="ApplicationProgramsFolder" On="uninstall"/>' + "`n"
        $wxsShortcuts += '        <RegistryValue Root="HKCU" Key="Software\bitbeans\SimpleDNSCrypt" Name="installed" Type="integer" Value="1" KeyPath="yes"/>' + "`n"
        $wxsShortcuts += '      </Component>' + "`n"
        $wxsShortcuts += '    </DirectoryRef>' + "`n"
        $wxsShortcuts += '    <DirectoryRef Id="DesktopFolder">' + "`n"
        $wxsShortcuts += '      <Component Id="DesktopShortcut" Guid="C8EBD84A-5274-4C25-A6CA-37694E52A26D">' + "`n"
        $wxsShortcuts += '        <Shortcut Id="ApplicationDesktopShortcut" Name="SimpleDNSCrypt" Description="SimpleDNSCrypt - A simple management tool for dnscrypt-proxy" Target="[#SimpleDnsCryptExe]" WorkingDirectory="INSTALLFOLDER"/>' + "`n"
        $wxsShortcuts += '        <RegistryValue Root="HKCU" Key="Software\bitbeans\SimpleDNSCrypt" Name="desktop_shortcut" Type="integer" Value="1" KeyPath="yes"/>' + "`n"
        $wxsShortcuts += '      </Component>' + "`n"
        $wxsShortcuts += '    </DirectoryRef>' + "`n"
        
        $wxsFooter = '  </Product>' + "`n"
        $wxsFooter += '</Wix>'
        
        # Combine all parts
        $wxsContent = $wxsHeader + $wxsPackage + $wxsFeature + $wxsDirectories + $wxsComponents + $wxsShortcuts + $wxsFooter
        
        # Write to file
        $wxsContent | Out-File -FilePath "SimpleDnsCrypt.wxs" -Encoding UTF8

        # 编译WiX
        & candle.exe SimpleDnsCrypt.wxs
        if ($LASTEXITCODE -ne 0) {
          echo "WiX candle compilation failed"
          exit 1
        }

        & light.exe -ext WixUIExtension SimpleDnsCrypt.wixobj -out "dist\SimpleDnsCrypt-$version-x64-setup.msi"
        if ($LASTEXITCODE -ne 0) {
          echo "WiX light linking failed"
          exit 1
        }

        echo "Created MSI installer"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SimpleDnsCrypt-Release
        path: dist/
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
